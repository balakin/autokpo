name: 🚀 Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions: {} # deny all by default; each job grants only what it needs

jobs:
  release:
    name: 📦 Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create git tags and GitHub Releases (changesets/action)
      issues: write # post comments on issues (changesets/action)
      pull-requests: write # create and update the Release PR (changesets/action)
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published-packages: ${{ steps.changesets.outputs.published-packages }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Setup
        uses: ./.github/actions/setup
        with:
          cache: false # clean install to prevent cache poisoning from PR-sourced cache entries

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          publish-script: pnpm changeset git-tag
          pr-title: 'chore: release packages'
          commit-message: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tags pushed by changesets/action use GITHUB_TOKEN, so GitHub suppresses the
  # `push`/`create` events that would otherwise fire a tag trigger on the deploys.
  # Calling them as reusable workflows sidesteps that — and needs no `actions: write`.
  # They run at the same commit the release tags point at (current main HEAD).
  deploy-app:
    name: 🚀 Deploy app
    needs: release
    if: ${{ needs.release.outputs.published == 'true' && contains(needs.release.outputs.published-packages, '"@autokpo/app"') }}
    permissions:
      contents: read # ceiling for the reusable workflow's build job (checkout)
    uses: ./.github/workflows/deploy-app.yml
    secrets: inherit

  deploy-website:
    name: 🚀 Deploy website
    needs: release
    if: ${{ needs.release.outputs.published == 'true' && contains(needs.release.outputs.published-packages, '"@autokpo/website"') }}
    permissions:
      contents: read # ceiling for the reusable workflow's build job (checkout)
    uses: ./.github/workflows/deploy-website.yml
    secrets: inherit
