name: ✍️ Generate PR Description

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  collect:
    name: Collect bounded PR context
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event.pull_request.user.id == 68006090 &&
      github.event.pull_request.head.repo.id == github.event.repository.id
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Download immutable base snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .review-snapshots/BASE
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          show-progress: false

      - name: Download immutable head snapshot without executing it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .review-snapshots/HEAD
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          show-progress: false

      - name: Sanitize and bound repository snapshots
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SNAPSHOT_ROOT: ${{ github.workspace }}/.review-snapshots
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");

          const snapshotRoot = process.env.SNAPSHOT_ROOT;
          const snapshots = [
            { name: "BASE", sha: process.env.BASE_SHA },
            { name: "HEAD", sha: process.env.HEAD_SHA },
          ];
          const maximumEntries = 50_000;
          const maximumBytes = 250 * 1024 * 1024;
          let entries = 0;
          let bytes = 0;

          for (const snapshot of snapshots) {
            if (!/^[0-9a-f]{40}$/u.test(snapshot.sha ?? "")) {
              throw new Error(`Invalid ${snapshot.name} snapshot SHA.`);
            }
            const root = path.join(snapshotRoot, snapshot.name);
            fs.rmSync(path.join(root, ".git"), { recursive: true, force: true });
            const manifestPath = path.join(root, ".opencode-review-snapshot.json");
            fs.rmSync(manifestPath, { recursive: true, force: true });
            const manifest = `${JSON.stringify({ schemaVersion: 1, snapshot: snapshot.name, sha: snapshot.sha })}\n`;
            fs.writeFileSync(manifestPath, manifest, { mode: 0o444, flag: "wx" });
            const pending = [root];
            while (pending.length) {
              const directory = pending.pop();
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                const entryPath = path.join(directory, entry.name);
                const metadata = fs.lstatSync(entryPath);
                entries += 1;
                if (metadata.isSymbolicLink()) {
                  const target = fs.readlinkSync(entryPath);
                  fs.unlinkSync(entryPath);
                  const replacement = `Symlink target (not followed): ${target}\n`;
                  fs.writeFileSync(entryPath, replacement, { mode: 0o444 });
                  bytes += Buffer.byteLength(replacement);
                } else if (metadata.isDirectory()) {
                  pending.push(entryPath);
                } else if (metadata.isFile()) {
                  bytes += metadata.size;
                } else {
                  throw new Error(`Unsupported repository entry type: ${entryPath}`);
                }
                if (entries > maximumEntries || bytes > maximumBytes) {
                  throw new Error("Repository snapshots exceed the review workspace limits.");
                }
              }
            }
          }
          console.log(`Prepared ${entries} entries (${bytes} bytes) across BASE and HEAD snapshots.`);
          JS

      - name: Collect PR data without executing repository code
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("node:fs");
            const path = require("node:path");

            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            const number = Number(process.env.PR_NUMBER);
            const expectedBaseSha = process.env.BASE_SHA;
            const expectedHeadSha = process.env.HEAD_SHA;

            function bounded(value, limit) {
              const raw = Buffer.from(String(value ?? ""), "utf8");
              if (raw.length <= limit) return [raw.toString("utf8"), false];
              let end = limit;
              const decoder = new TextDecoder("utf-8", { fatal: true });
              while (end > 0) {
                try {
                  return [decoder.decode(raw.subarray(0, end)), true];
                } catch {
                  end -= 1;
                }
              }
              return ["", true];
            }

            function hasNextPage(response) {
              return /(?:^|,)\s*<[^>]+>;\s*rel="next"(?:\s*(?:;|,|$))/u.test(response.headers.link ?? "");
            }

            function addedLines(patch) {
              const lines = [];
              let current = null;
              for (const rawLine of String(patch ?? "").split(/\r?\n/u)) {
                if (rawLine.startsWith("@@")) {
                  const match = rawLine.match(/\+(\d+)/u);
                  current = match ? Number(match[1]) : null;
                } else if (rawLine === "\\ No newline at end of file") {
                  continue;
                } else if (current !== null && rawLine.startsWith("+") && !rawLine.startsWith("+++")) {
                  lines.push(current);
                  current += 1;
                } else if (current !== null && !rawLine.startsWith("-")) {
                  current += 1;
                }
              }
              return lines;
            }

            const pullResponse = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const filesResponse = await github.rest.pulls.listFiles({ owner, repo, pull_number: number, per_page: 100 });
            const commitsResponse = await github.rest.pulls.listCommits({ owner, repo, pull_number: number, per_page: 50 });
            const issueCommentsResponse = await github.rest.issues.listComments({ owner, repo, issue_number: number, per_page: 50 });
            const reviewCommentsResponse = await github.rest.pulls.listReviewComments({ owner, repo, pull_number: number, per_page: 50 });
            const reviewsResponse = await github.rest.pulls.listReviews({ owner, repo, pull_number: number, per_page: 50 });
            const pull = pullResponse.data;
            if (pull.base.sha !== expectedBaseSha || pull.head.sha !== expectedHeadSha) {
              throw new Error("PR base or head changed while immutable snapshots were collected.");
            }

            let patchBudget = 200_000;
            const files = [];
            const changedPaths = [];
            const changedLines = Object.create(null);
            let patchTruncated = false;
            for (const item of filesResponse.data.slice(0, 100)) {
              const [filePath] = bounded(item.filename, 1_024);
              const [patch, truncated] = bounded(item.patch, Math.min(40_000, patchBudget));
              patchBudget -= Buffer.byteLength(patch);
              patchTruncated ||= truncated || !item.patch;
              changedPaths.push(filePath);
              changedLines[filePath] = addedLines(patch);
              files.push({
                path: filePath,
                status: item.status,
                additions: item.additions,
                deletions: item.deletions,
                patch,
              });
              if (patchBudget <= 0) {
                patchTruncated = true;
                break;
              }
            }

            const commits = commitsResponse.data.slice(0, 50).map((item) => ({
              sha: String(item.sha ?? "").slice(0, 40),
              message: bounded(item.commit?.message, 1_024)[0],
            }));

            function discussions(items) {
              return items.slice(0, 50).map((item) => ({
                authorId: item.user?.id ?? null,
                path: item.path ?? null,
                line: item.line ?? null,
                body: bounded(item.body, 2_000)[0],
              }));
            }

            const [title, titleTruncated] = bounded(pull.title, 512);
            const [body, bodyTruncated] = bounded(pull.body, 12_000);
            const allDiscussion = [
              ...discussions(issueCommentsResponse.data),
              ...discussions(reviewCommentsResponse.data),
              ...discussions(reviewsResponse.data),
            ];
            const descriptionContext = {
              schemaVersion: 1,
              kind: "description",
              repository,
              number,
              baseSha: expectedBaseSha,
              headSha: expectedHeadSha,
              title,
              body,
              changedPaths,
              changedLines,
              files,
              commits,
              discussion: allDiscussion.slice(0, 50),
              truncated: {
                title: titleTruncated,
                body: bodyTruncated,
                files: hasNextPage(filesResponse) || filesResponse.data.length > files.length,
                patches: patchTruncated,
                commits: hasNextPage(commitsResponse),
                discussion:
                  hasNextPage(issueCommentsResponse) ||
                  hasNextPage(reviewCommentsResponse) ||
                  hasNextPage(reviewsResponse) ||
                  allDiscussion.length > 50,
              },
            };
            const encoded = `${JSON.stringify(descriptionContext)}\n`;
            if (Buffer.byteLength(encoded) > 512_000) {
              throw new Error("Bounded description context unexpectedly exceeds 512 KiB.");
            }
            const outputDirectory = path.join(process.env.RUNNER_TEMP, "context");
            fs.mkdirSync(outputDirectory, { recursive: true });
            fs.writeFileSync(path.join(outputDirectory, "context.json"), encoded);

      - name: Upload bounded context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-description-context
          path: ${{ runner.temp }}/context/context.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload read-only review workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-description-workspace
          path: ${{ github.workspace }}/.review-snapshots
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  model:
    name: Generate isolated description
    needs: collect
    permissions: {}
    uses: ./.github/workflows/opencode-model.yml
    with:
      context-artifact: opencode-description-context
      workspace-artifact: opencode-description-workspace
      mode: description
      model: ${{ vars.OPENCODE_PR_MODEL || 'opencode-go/minimax-m3' }}
      result-artifact: opencode-description-result
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

  publish:
    name: Publish validated description
    needs: [collect, model]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Download bounded context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opencode-description-context
          path: ${{ runner.temp }}/context

      - name: Download validated result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opencode-description-result
          path: ${{ runner.temp }}/result

      - name: Revalidate and update managed section
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("node:fs");
            const path = require("node:path");

            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            const number = Number(process.env.PR_NUMBER);
            const temp = process.env.RUNNER_TEMP;
            const descriptionContext = JSON.parse(fs.readFileSync(path.join(temp, "context/context.json"), "utf8"));
            const result = JSON.parse(fs.readFileSync(path.join(temp, "result/result.json"), "utf8"));

            function isObject(value) {
              return value !== null && typeof value === "object" && !Array.isArray(value);
            }

            function hasExactKeys(value, expected) {
              return isObject(value) && Object.keys(value).sort().join("\0") === [...expected].sort().join("\0");
            }

            function hasUnpairedSurrogate(value) {
              for (let index = 0; index < value.length; index += 1) {
                const code = value.charCodeAt(index);
                if (code >= 0xd800 && code <= 0xdbff) {
                  const next = value.charCodeAt(index + 1);
                  if (!(next >= 0xdc00 && next <= 0xdfff)) return true;
                  index += 1;
                } else if (code >= 0xdc00 && code <= 0xdfff) {
                  return true;
                }
              }
              return false;
            }

            function clean(value, limit) {
              if (typeof value !== "string" || hasUnpairedSurrogate(value)) {
                throw new Error("Description item is not valid text.");
              }
              const cleaned = value
                .split(/\s+/u)
                .filter(Boolean)
                .join(" ")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll("@", "@\u200b");
              if (cleaned.length < 1 || cleaned.length > limit) {
                throw new Error("Description item has invalid length.");
              }
              return cleaned;
            }

            if (descriptionContext.repository !== repository || descriptionContext.number !== number) {
              throw new Error("Context target does not match the triggering PR.");
            }
            const pull = (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
            if (pull.user?.id !== 68006090 || pull.head?.repo?.full_name !== repository) {
              throw new Error("PR authorization changed before publication.");
            }
            if (pull.head.sha !== descriptionContext.headSha || pull.base.sha !== descriptionContext.baseSha) {
              console.log("Skipping stale description because the PR base or head changed.");
              return;
            }

            if (
              !hasExactKeys(result, ["schemaVersion", "whatChanged", "why", "breakingChanges"]) ||
              !Number.isInteger(result.schemaVersion) ||
              result.schemaVersion !== 1
            ) {
              throw new Error("Invalid description result contract.");
            }
            if (!Array.isArray(result.whatChanged) || result.whatChanged.length < 2 || result.whatChanged.length > 5) {
              throw new Error("Invalid whatChanged items.");
            }
            if (typeof result.why !== "string" || result.why.length < 1 || result.why.length > 2_000) {
              throw new Error("Invalid description motivation.");
            }
            if (!Array.isArray(result.breakingChanges) || result.breakingChanges.length > 5) {
              throw new Error("Invalid breakingChanges items.");
            }

            const whatChanged = result.whatChanged.map((item) => clean(item, 500));
            const why = clean(result.why, 2_000);
            const breaking = result.breakingChanges.map((item) => clean(item, 500));

            const latest = (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
            if (latest.user?.id !== 68006090 || latest.head?.repo?.full_name !== repository) {
              throw new Error("PR authorization changed before publication.");
            }
            if (latest.head.sha !== descriptionContext.headSha || latest.base.sha !== descriptionContext.baseSha) {
              console.log("Skipping stale description because the PR changed before publication.");
              return;
            }

            const start = "<!-- opencode:pr-description:start -->";
            const end = "<!-- opencode:pr-description:end -->";
            const blockLines = [
              start,
              "---",
              "",
              "## OpenCode-generated summary",
              "",
              "> [!NOTE]",
              "> This section was generated automatically by OpenCode. Content outside this section is human-written.",
              "",
              "### What changed",
              "",
              ...whatChanged.map((item) => `- ${item}`),
              "",
              "### Why",
              "",
              why,
              "",
              "### Breaking changes",
              "",
              ...(breaking.length ? breaking.map((item) => `- ${item}`) : ["None."]),
              "",
              "---",
              end,
            ];
            const block = blockLines.join("\n");
            const current = latest.body ?? "";
            const startCount = current.split(start).length - 1;
            const endCount = current.split(end).length - 1;
            let updated;
            if (startCount === 0 && endCount === 0) {
              updated = current ? `${current}\n\n${block}` : block;
            } else if (startCount === 1 && endCount === 1 && current.indexOf(start) < current.indexOf(end)) {
              const before = current.slice(0, current.indexOf(start));
              const after = current.slice(current.indexOf(end) + end.length);
              updated = before + block + after;
            } else {
              console.log("Skipping description because managed markers are malformed.");
              return;
            }

            if (updated.length > 60_000) {
              throw new Error("Rendered PR description is too large.");
            }
            if (updated !== current) {
              await github.rest.pulls.update({ owner, repo, pull_number: number, body: updated });
            }
