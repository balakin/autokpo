    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="AutoKPO" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=contain"
    />
    <meta name="theme-color" content="#f3f5f6" />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="AutoKPO" />
    <meta
      property="og:description"
      content="AutoKPO — local-first web app for generating the Serbian tax Knjiga o ostvarenom prometu (KPO — Book of Achieved Turnover). Syncs across devices."
    />
    <meta property="og:site_name" content="AutoKPO" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.autokpo.com" />
    <meta property="og:image" content="https://app.autokpo.com/og-image.png" />
    <meta name="twitter:card" content="summary" />
    <meta
      name="description"
      content="AutoKPO — local-first web app for generating the Serbian tax Knjiga o ostvarenom prometu (KPO — Book of Achieved Turnover). Syncs across devices."
    />
    <title>AutoKPO</title>
    <script>
      // Must run before any ES module so Zod's allowsEval() check sees jitless:true
      // and skips the new Function() probe that fires a CSP violation in Firefox.
      globalThis.__zod_globalConfig = { jitless: true };
    </script>
    <script>
      try {
        var t = localStorage.getItem('autokpo:theme');
        var dark =
          t === 'dark' ||
          ((t === 'system' || !t) &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        var resolved = dark ? 'dark' : 'light';
        document.documentElement.classList.add(resolved);
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.style.colorScheme = resolved;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', dark ? '#080d16' : '#f3f5f6');
      } catch {}
    </script>
  </head>
  <body class="text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
