name: 💬 OpenCode Review

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  collect:
    name: Collect bounded PR context
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event.pull_request.user.id == 68006090 &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      !github.event.pull_request.draft
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Download immutable base snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .review-snapshots/BASE
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          show-progress: false

      - name: Download immutable head snapshot without executing it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .review-snapshots/HEAD
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          show-progress: false

      - name: Sanitize and bound repository snapshots
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SNAPSHOT_ROOT: ${{ github.workspace }}/.review-snapshots
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");

          const snapshotRoot = process.env.SNAPSHOT_ROOT;
          const snapshots = [
            { name: "BASE", sha: process.env.BASE_SHA },
            { name: "HEAD", sha: process.env.HEAD_SHA },
          ];
          const maximumEntries = 50_000;
          const maximumBytes = 250 * 1024 * 1024;
          let entries = 0;
          let bytes = 0;

          for (const snapshot of snapshots) {
            if (!/^[0-9a-f]{40}$/u.test(snapshot.sha ?? "")) {
              throw new Error(`Invalid ${snapshot.name} snapshot SHA.`);
            }
            const root = path.join(snapshotRoot, snapshot.name);
            fs.rmSync(path.join(root, ".git"), { recursive: true, force: true });
            const manifestPath = path.join(root, ".opencode-review-snapshot.json");
            fs.rmSync(manifestPath, { recursive: true, force: true });
            const manifest = `${JSON.stringify({ schemaVersion: 1, snapshot: snapshot.name, sha: snapshot.sha })}\n`;
            fs.writeFileSync(manifestPath, manifest, { mode: 0o444, flag: "wx" });
            const pending = [root];
            while (pending.length) {
              const directory = pending.pop();
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                const entryPath = path.join(directory, entry.name);
                const metadata = fs.lstatSync(entryPath);
                entries += 1;
                if (metadata.isSymbolicLink()) {
                  const target = fs.readlinkSync(entryPath);
                  fs.unlinkSync(entryPath);
                  const replacement = `Symlink target (not followed): ${target}\n`;
                  fs.writeFileSync(entryPath, replacement, { mode: 0o444 });
                  bytes += Buffer.byteLength(replacement);
                } else if (metadata.isDirectory()) {
                  pending.push(entryPath);
                } else if (metadata.isFile()) {
                  bytes += metadata.size;
                } else {
                  throw new Error(`Unsupported repository entry type: ${entryPath}`);
                }
                if (entries > maximumEntries || bytes > maximumBytes) {
                  throw new Error("Repository snapshots exceed the review workspace limits.");
                }
              }
            }
          }
          console.log(`Prepared ${entries} entries (${bytes} bytes) across BASE and HEAD snapshots.`);
          JS

      - name: Collect PR data without executing repository code
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("node:fs");
            const path = require("node:path");

            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            const number = Number(process.env.PR_NUMBER);
            const expectedBaseSha = process.env.BASE_SHA;
            const expectedHeadSha = process.env.HEAD_SHA;

            function bounded(value, limit) {
              const raw = Buffer.from(String(value ?? ""), "utf8");
              if (raw.length <= limit) return [raw.toString("utf8"), false];
              let end = limit;
              const decoder = new TextDecoder("utf-8", { fatal: true });
              while (end > 0) {
                try {
                  return [decoder.decode(raw.subarray(0, end)), true];
                } catch {
                  end -= 1;
                }
              }
              return ["", true];
            }

            function hasNextPage(response) {
              return /(?:^|,)\s*<[^>]+>;\s*rel="next"(?:\s*(?:;|,|$))/u.test(response.headers.link ?? "");
            }

            function addedLines(patch) {
              const lines = [];
              let current = null;
              for (const rawLine of String(patch ?? "").split(/\r?\n/u)) {
                if (rawLine.startsWith("@@")) {
                  const match = rawLine.match(/\+(\d+)/u);
                  current = match ? Number(match[1]) : null;
                } else if (current !== null && rawLine.startsWith("+") && !rawLine.startsWith("+++")) {
                  lines.push(current);
                  current += 1;
                } else if (current !== null && !rawLine.startsWith("-")) {
                  current += 1;
                }
              }
              return lines;
            }

            const pullResponse = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const filesResponse = await github.rest.pulls.listFiles({ owner, repo, pull_number: number, per_page: 100 });
            const commitsResponse = await github.rest.pulls.listCommits({ owner, repo, pull_number: number, per_page: 50 });
            const issueCommentsResponse = await github.rest.issues.listComments({ owner, repo, issue_number: number, per_page: 50 });
            const reviewCommentsResponse = await github.rest.pulls.listReviewComments({ owner, repo, pull_number: number, per_page: 50 });
            const reviewsResponse = await github.rest.pulls.listReviews({ owner, repo, pull_number: number, per_page: 50 });
            const pull = pullResponse.data;
            if (pull.base.sha !== expectedBaseSha || pull.head.sha !== expectedHeadSha) {
              throw new Error("PR base or head changed while immutable snapshots were collected.");
            }

            let patchBudget = 200_000;
            const files = [];
            const changedPaths = [];
            const changedLines = Object.create(null);
            let patchTruncated = false;
            for (const item of filesResponse.data.slice(0, 100)) {
              const [filePath] = bounded(item.filename, 1_024);
              const [patch, truncated] = bounded(item.patch, Math.min(40_000, patchBudget));
              patchBudget -= Buffer.byteLength(patch);
              patchTruncated ||= truncated || !item.patch;
              changedPaths.push(filePath);
              changedLines[filePath] = addedLines(patch);
              files.push({
                path: filePath,
                status: item.status,
                additions: item.additions,
                deletions: item.deletions,
                patch,
              });
              if (patchBudget <= 0) {
                patchTruncated = true;
                break;
              }
            }

            const commits = commitsResponse.data.slice(0, 50).map((item) => ({
              sha: String(item.sha ?? "").slice(0, 40),
              message: bounded(item.commit?.message, 1_024)[0],
            }));

            function discussions(items) {
              return items.slice(0, 50).map((item) => ({
                authorId: item.user?.id ?? null,
                path: item.path ?? null,
                line: item.line ?? null,
                body: bounded(item.body, 2_000)[0],
              }));
            }

            const [title, titleTruncated] = bounded(pull.title, 512);
            const [body, bodyTruncated] = bounded(pull.body, 12_000);
            const allDiscussion = [
              ...discussions(issueCommentsResponse.data),
              ...discussions(reviewCommentsResponse.data),
              ...discussions(reviewsResponse.data),
            ];
            const reviewContext = {
              schemaVersion: 1,
              kind: "review",
              repository,
              number,
              baseSha: expectedBaseSha,
              headSha: expectedHeadSha,
              title,
              body,
              changedPaths,
              changedLines,
              files,
              commits,
              discussion: allDiscussion.slice(0, 50),
              truncated: {
                title: titleTruncated,
                body: bodyTruncated,
                files: hasNextPage(filesResponse) || filesResponse.data.length > files.length,
                patches: patchTruncated,
                commits: hasNextPage(commitsResponse),
                discussion:
                  hasNextPage(issueCommentsResponse) ||
                  hasNextPage(reviewCommentsResponse) ||
                  hasNextPage(reviewsResponse) ||
                  allDiscussion.length > 50,
              },
            };
            const encoded = `${JSON.stringify(reviewContext)}\n`;
            if (Buffer.byteLength(encoded) > 512_000) {
              throw new Error("Bounded PR context unexpectedly exceeds 512 KiB.");
            }
            const outputDirectory = path.join(process.env.RUNNER_TEMP, "context");
            fs.mkdirSync(outputDirectory, { recursive: true });
            fs.writeFileSync(path.join(outputDirectory, "context.json"), encoded);

      - name: Upload bounded context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-review-context
          path: ${{ runner.temp }}/context/context.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload read-only review workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-review-workspace
          path: ${{ github.workspace }}/.review-snapshots
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  model:
    name: Run isolated reviewer
    needs: collect
    permissions: {}
    uses: ./.github/workflows/opencode-model.yml
    with:
      context-artifact: opencode-review-context
      workspace-artifact: opencode-review-workspace
      mode: review
      model: ${{ vars.OPENCODE_REVIEW_MODEL || 'opencode-go/gpt-5.6-luna' }}
      result-artifact: opencode-review-result
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

  publish:
    name: Publish validated review
    needs: [collect, model]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Download bounded context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opencode-review-context
          path: ${{ runner.temp }}/context

      - name: Download validated result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opencode-review-result
          path: ${{ runner.temp }}/result

      - name: Revalidate and publish COMMENT review
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("node:fs");
            const path = require("node:path");

            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            const number = Number(process.env.PR_NUMBER);
            const temp = process.env.RUNNER_TEMP;
            const reviewContext = JSON.parse(fs.readFileSync(path.join(temp, "context/context.json"), "utf8"));
            const result = JSON.parse(fs.readFileSync(path.join(temp, "result/result.json"), "utf8"));

            function isObject(value) {
              return value !== null && typeof value === "object" && !Array.isArray(value);
            }

            function hasExactKeys(value, expected) {
              return isObject(value) && Object.keys(value).sort().join("\0") === [...expected].sort().join("\0");
            }

            function hasUnpairedSurrogate(value) {
              for (let index = 0; index < value.length; index += 1) {
                const code = value.charCodeAt(index);
                if (code >= 0xd800 && code <= 0xdbff) {
                  const next = value.charCodeAt(index + 1);
                  if (!(next >= 0xdc00 && next <= 0xdfff)) return true;
                  index += 1;
                } else if (code >= 0xdc00 && code <= 0xdfff) {
                  return true;
                }
              }
              return false;
            }

            function safeModelText(value) {
              if (/[\x00-\x08\x0b\x0c\x0e-\x1f]/u.test(value) || hasUnpairedSurrogate(value)) {
                throw new Error("Review contains control characters or malformed Unicode.");
              }
              const lowered = value.toLowerCase();
              if (
                value.includes("<!--") ||
                value.includes("![") ||
                ["<img", "<script", "<style", "<iframe"].some((tag) => lowered.includes(tag))
              ) {
                throw new Error("Review contains unsafe Markdown or HTML.");
              }
            }

            if (reviewContext.repository !== repository || reviewContext.number !== number) {
              throw new Error("Context target does not match the triggering PR.");
            }
            const pull = (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
            if (pull.head.sha !== reviewContext.headSha || pull.base.sha !== reviewContext.baseSha) {
              console.log("Skipping stale review because the PR base or head changed.");
              return;
            }

            if (
              !hasExactKeys(result, ["schemaVersion", "summary", "findings"]) ||
              !Number.isInteger(result.schemaVersion) ||
              result.schemaVersion !== 1
            ) {
              throw new Error("Invalid review result contract.");
            }
            if (typeof result.summary !== "string" || result.summary.length < 1 || result.summary.length > 8_000) {
              throw new Error("Invalid review summary.");
            }
            safeModelText(result.summary);
            if (!Array.isArray(result.findings) || result.findings.length > 5) {
              throw new Error("Invalid review findings.");
            }
            const changed = new Set(reviewContext.changedPaths ?? []);
            const changedLines = reviewContext.changedLines ?? {};
            for (const finding of result.findings) {
              if (!hasExactKeys(finding, ["severity", "path", "line", "title", "body"])) {
                throw new Error("Invalid finding fields.");
              }
              if (!["critical", "high", "medium"].includes(finding.severity)) {
                throw new Error("Invalid severity.");
              }
              if (!changed.has(finding.path)) {
                throw new Error("Finding references an unchanged path.");
              }
              if (!Number.isInteger(finding.line) || !(changedLines[finding.path] ?? []).includes(finding.line)) {
                throw new Error("Finding does not reference an added line.");
              }
              if (typeof finding.title !== "string" || finding.title.length < 1 || finding.title.length > 120) {
                throw new Error("Invalid finding title.");
              }
              if (typeof finding.body !== "string" || finding.body.length < 1 || finding.body.length > 2_000) {
                throw new Error("Invalid finding body.");
              }
              safeModelText(finding.title);
              safeModelText(finding.body);
            }

            const marker = `<!-- opencode-review:${reviewContext.baseSha}:${reviewContext.headSha} -->`;
            const reviews = [];
            let complete = false;
            for (let page = 1; page <= 20; page += 1) {
              const batch = (await github.rest.pulls.listReviews({ owner, repo, pull_number: number, per_page: 100, page })).data;
              reviews.push(...batch);
              if (batch.length < 100) {
                complete = true;
                break;
              }
            }
            if (!complete) {
              throw new Error("Too many existing reviews to prove idempotence safely.");
            }
            if (reviews.some((review) => review.user?.id === 41898282 && (review.body ?? "").includes(marker))) {
              console.log("A review for this head SHA already exists.");
              return;
            }

            const safe = (text) => text.replaceAll("@", "@\u200b").replaceAll("`", "'");
            const lines = [marker, "## OpenCode review", "", safe(result.summary)];
            if (result.findings.length) {
              lines.push("", "### Actionable findings", "");
              const labels = { critical: "Critical", high: "High", medium: "Medium" };
              for (const finding of result.findings) {
                lines.push(
                  `- **${labels[finding.severity]} — ${safe(finding.title)}**`,
                  `  \`${safe(finding.path)}\` line ${finding.line}: ${safe(finding.body)}`,
                );
              }
            } else {
              lines.push("", "No actionable findings met the publication threshold.");
            }
            const body = lines.join("\n");
            if (body.length > 60_000) {
              throw new Error("Rendered review is too large.");
            }
            const latest = (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
            if (latest.head.sha !== reviewContext.headSha || latest.base.sha !== reviewContext.baseSha) {
              console.log("Skipping stale review because the PR changed before publication.");
              return;
            }
            await github.rest.pulls.createReview({ owner, repo, pull_number: number, body, event: "COMMENT" });
