  tooling:
    typescript: '~6.0.3'
    '@types/node': '^25.9.2'
    prettier: '^3.8.3'
    husky: '^9.1.7'
    lint-staged: '^17.0.7'
    turbo: '^2.9.16'
    jiti: '^2.7.0'
    cross-env: '^10.1.0'
    '@changesets/changelog-github': '^0.7.0'
