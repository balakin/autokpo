name: OpenCode GitHub Action
description: Run OpenCode in GitHub Actions workflows

inputs:
  model:
    description: Model to use
    required: true
  agent:
    description: Primary agent to use
    required: false
  share:
    description: Whether to share the OpenCode session
    required: false
  prompt:
    description: Custom prompt that overrides the default prompt
    required: false
  use_github_token:
    description: Use GITHUB_TOKEN instead of the OpenCode App token exchange
    required: false
    default: 'false'
  mentions:
    description: Comma-separated trigger phrases
    required: false
  variant:
    description: Provider-specific model variant
    required: false
  oidc_base_url:
    description: Base URL for a custom OpenCode App token exchange
    required: false

runs:
  using: composite
  steps:
    - name: Get OpenCode version
      id: version
      shell: bash
      run: |
        version=$(curl --fail --silent https://api.github.com/repos/anomalyco/opencode/releases/latest |
          jq --raw-output '.tag_name // "latest"')
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache OpenCode
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.opencode/bin
        key: opencode-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Install OpenCode
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: curl --fail --silent --show-error --location https://opencode.ai/install | bash

    - name: Add OpenCode to PATH
      shell: bash
      run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

    - name: Run OpenCode
      id: run-opencode
      shell: bash
      run: opencode github run
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
