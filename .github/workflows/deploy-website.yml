name: 🚀 Deploy Website

on:
  workflow_dispatch:
  workflow_call:

permissions: {} # deny all by default; each job grants only what it needs

# Serialize website deploys; never cancel one in flight.
concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  # Build runs untrusted dependency code but holds no Cloudflare credentials.
  # The website is a static Astro build, so the artifact is just dist/ + config.
  build:
    name: 🏗️ Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout
    # Single source of truth for the wrangler version: the deploy job installs the
    # exact version resolved here from the lockfile, so build and deploy never drift.
    outputs:
      wrangler-version: ${{ steps.wrangler-version.outputs.version }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: ⚙️ Setup
        uses: ./.github/actions/setup
        with:
          cache: false # clean install, no restored cache — guards against cache poisoning of the build output

      - name: 🔖 Resolve wrangler version
        id: wrangler-version
        run: echo "version=$(pnpm -s --filter @autokpo/website exec node -p 'require("wrangler/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: 🏗️ Build
        # PUBLIC_* are inlined into the bundle at build time; turbo.json declares
        # `env: [..., "PUBLIC_*"]` so strict mode passes them through.
        env:
          PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.PUBLIC_POSTHOG_PROJECT_TOKEN }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
        run: pnpm turbo build --filter=@autokpo/website

      - name: 📤 Upload deploy artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-dist
          retention-days: 1
          path: |
            apps/website/dist
            apps/website/wrangler.jsonc

  # Deploy holds the Cloudflare credentials and runs only the pinned wrangler-action
  # — no pnpm install, no dependency code. The site is assets-only (no Worker), so
  # `wrangler deploy` simply uploads the prebuilt dist/ named in wrangler.jsonc.
  deploy:
    name: 🚀 Deploy website
    needs: build
    runs-on: ubuntu-24.04
    permissions: {} # no checkout; consumes the same-run build artifact only
    environment:
      name: Website
      url: https://autokpo.com
    steps:
      - name: 📥 Download deploy artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website-dist
          path: apps/website

      - name: 🚀 Deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ needs.build.outputs.wrangler-version }} # matches the build's lockfile version
          workingDirectory: apps/website
          command: deploy
