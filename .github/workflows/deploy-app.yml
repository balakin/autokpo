name: 🚀 Deploy App

on:
  workflow_dispatch:
  workflow_call:

permissions: {} # deny all by default; each job grants only what it needs

# Serialize app deploys; never cancel one in flight.
concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  # Build runs untrusted dependency code (install scripts, Vite/esbuild plugins)
  # but holds no Cloudflare credentials. @cloudflare/vite-plugin bundles the worker
  # into dist/autokpo_app/ (including a generated wrangler.json deploy snapshot that
  # already references the prebuilt assets), so the deploy job never re-bundles and
  # needs no node_modules.
  build:
    name: 🏗️ Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: ⚙️ Setup
        uses: ./.github/actions/setup
        with:
          cache: false # clean install, no restored cache — guards against cache poisoning of the build output

      - name: 🏗️ Build
        # VITE_* are inlined into the browser bundle at build time; turbo.json declares
        # `env: ["VITE_*", "CLOUDFLARE_ENV", ...]` so strict mode passes them through.
        # CLOUDFLARE_ENV selects which env the vite plugin bakes into the generated
        # dist/autokpo_app/wrangler.json deploy snapshot.
        env:
          CLOUDFLARE_ENV: production
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
        run: pnpm turbo build --filter=@autokpo/app

      - name: 📤 Upload deploy artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-dist
          retention-days: 1
          include-hidden-files: true # keep dist/client/.assetsignore
          # dist/ is the deployable output; .wrangler/deploy/config.json is the
          # redirect that points `wrangler deploy` at the generated snapshot so it
          # never re-bundles. wrangler.jsonc + worker/ back `d1 migrations apply`,
          # which reads migrations_dir from the source config.
          # Exclude any local secret files the build may have copied in — they must
          # never leave the build runner via the artifact.
          path: |
            apps/app/dist
            !apps/app/dist/**/.dev.vars
            !apps/app/dist/**/.dev.vars.*
            !apps/app/dist/**/.env
            !apps/app/dist/**/.env.*
            apps/app/.wrangler/deploy/config.json
            apps/app/wrangler.jsonc
            apps/app/worker

  # Deploy holds the Cloudflare credentials and runs the minimum possible code: the
  # pinned wrangler-action installs only wrangler (no pnpm install, no dependency
  # lifecycle scripts) and ships the prebuilt artifact.
  deploy:
    name: 🚀 Deploy app
    needs: build
    runs-on: ubuntu-24.04
    permissions: {} # no checkout; consumes the same-run build artifact only
    environment:
      name: Application
      url: https://app.autokpo.com
    # Selects env.production for `d1 migrations apply` (which reads the source
    # config). `wrangler deploy` follows the build's redirect to the already
    # prod-baked generated config and ignores this.
    env:
      CLOUDFLARE_ENV: production
    steps:
      - name: 📥 Download deploy artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-dist
          path: apps/app

      - name: 🚀 Migrate & deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.98.0' # keep in sync with the wrangler catalog version
          workingDirectory: apps/app
          command: |
            d1 migrations apply DB --remote
            deploy
