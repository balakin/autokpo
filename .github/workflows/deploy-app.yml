name: 🚀 Deploy App

on:
  workflow_dispatch:

# Serialize app deploys; never cancel one in flight.
concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  deploy:
    name: 📦 Deploy app
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.autokpo.com
    env:
      CLOUDFLARE_ENV: production
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: ⚙️ Setup
        uses: ./.github/actions/setup
        with:
          cache: false # clean install, no restored cache — privileged context, guards against cache poisoning

      - name: 🏗️ Build
        # VITE_* are inlined into the browser bundle at build time; turbo.json declares
        # `env: ["VITE_*", ...]` so strict mode passes them through.
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
        run: pnpm turbo build --filter=@autokpo/app

      - name: 🗄️ Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @autokpo/app exec wrangler d1 migrations apply DB --remote

      - name: 🚀 Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @autokpo/app exec wrangler deploy
