name: 🚀 CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {} # deny all by default; each job grants only what it needs

jobs:
  verify:
    name: 🔍 Verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout
    env:
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: ⚙️ Setup
        uses: ./.github/actions/setup

      - name: 💾 Cache Turborepo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: 🔧 Check worker types are up to date
        run: pnpm check:worker-types

      - name: 🔎 Run linter
        run: pnpm turbo lint --affected

      - name: 🧪 Run tests
        run: pnpm turbo test --affected

      - name: 🏗️ Build project
        run: pnpm turbo build --affected
