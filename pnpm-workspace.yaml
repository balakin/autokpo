packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  core-js: false
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
autoInstallPeers: false
catalogMode: strict
cleanupUnusedCatalogs: true
engineStrict: true
minimumReleaseAge: 2880
strictPeerDependencies: true

catalogs:
