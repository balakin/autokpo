    '@vitejs/plugin-react': '^6.0.2'
    '@tailwindcss/vite': '^4.3.0'
    tailwindcss: '^4.3.0'
    vite-plugin-pwa: '^1.3.0'
    rolldown: '^1.1.0'
    '@rolldown/plugin-babel': '^0.2.3'
    rollup-plugin-visualizer: '^7.0.1'

  testing:
    vitest: '^4.1.8'
    '@testing-library/dom': '^10.4.1'
