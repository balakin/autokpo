name: 💬 OpenCode Command

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.comment.id }}
  cancel-in-progress: true

permissions: {}

jobs:
  collect:
    name: Collect bounded command context
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event.comment.user.id == 68006090 &&
      (
        github.event.comment.body == '/oc' ||
        startsWith(github.event.comment.body, '/oc ') ||
        github.event.comment.body == '/opencode' ||
        startsWith(github.event.comment.body, '/opencode ')
      )
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Collect issue or PR data without checkout
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_KIND: ${{ github.event_name }}
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("node:fs");
            const path = require("node:path");

            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            const target = Number(process.env.TARGET_NUMBER);
            const commentId = Number(process.env.COMMENT_ID);
            const kind = process.env.COMMENT_KIND;

            function bounded(value, limit) {
              const raw = Buffer.from(String(value ?? ""), "utf8");
              if (raw.length <= limit) return [raw.toString("utf8"), false];
              let end = limit;
              const decoder = new TextDecoder("utf-8", { fatal: true });
              while (end > 0) {
                try {
                  return [decoder.decode(raw.subarray(0, end)), true];
                } catch {
                  end -= 1;
                }
              }
              return ["", true];
            }

            function hasNextPage(response) {
              return /(?:^|,)\s*<[^>]+>;\s*rel="next"(?:\s*(?:;|,|$))/u.test(response.headers.link ?? "");
            }

            let source;
            let inlineContext = null;
            if (kind === "issue_comment") {
              source = (await github.rest.issues.getComment({ owner, repo, comment_id: commentId })).data;
            } else if (kind === "pull_request_review_comment") {
              source = (await github.rest.pulls.getReviewComment({ owner, repo, comment_id: commentId })).data;
              inlineContext = {
                path: source.path,
                line: source.line,
                diffHunk: bounded(source.diff_hunk, 8_000)[0],
              };
            } else {
              throw new Error("Unsupported comment event.");
            }

            const [command, commandTruncated] = bounded(source.body, 4_000);
            if (source.user?.id !== 68006090) {
              throw new Error("Command author is not authorized.");
            }
            if (!/^\/(?:oc|opencode)(?:\s|$)/u.test(command)) {
              throw new Error("Command syntax is not authorized.");
            }

            const issue = (await github.rest.issues.get({ owner, repo, issue_number: target })).data;
            const [issueBody, issueBodyTruncated] = bounded(issue.body, 12_000);
            const commentsResponse = await github.rest.issues.listComments({ owner, repo, issue_number: target, per_page: 50 });
            const discussion = commentsResponse.data.slice(0, 50).map((item) => ({
              authorId: item.user?.id,
              body: bounded(item.body, 2_000)[0],
            }));

            const commandContext = {
              schemaVersion: 1,
              kind: "command",
              repository,
              number: target,
              sourceCommentId: commentId,
              sourceCommentKind: kind,
              command,
              issue: {
                title: bounded(issue.title, 512)[0],
                body: issueBody,
                discussion,
              },
              inlineContext,
              changedPaths: [],
              pullRequest: null,
              truncated: {
                command: commandTruncated,
                issueBody: issueBodyTruncated,
                discussion: hasNextPage(commentsResponse),
              },
            };

            if (issue.pull_request || kind === "pull_request_review_comment") {
              const pull = (await github.rest.pulls.get({ owner, repo, pull_number: target })).data;
              const filesResponse = await github.rest.pulls.listFiles({ owner, repo, pull_number: target, per_page: 100 });
              const commitsResponse = await github.rest.pulls.listCommits({ owner, repo, pull_number: target, per_page: 50 });
              const files = [];
              const paths = [];
              let patchBudget = 200_000;
              let patchTruncated = false;
              for (const item of filesResponse.data.slice(0, 100)) {
                const filePath = bounded(item.filename, 1_024)[0];
                const [patch, truncated] = bounded(item.patch, Math.min(40_000, patchBudget));
                patchBudget -= Buffer.byteLength(patch);
                patchTruncated ||= truncated || !item.patch;
                paths.push(filePath);
                files.push({
                  path: filePath,
                  status: item.status,
                  additions: item.additions,
                  deletions: item.deletions,
                  patch,
                });
                if (patchBudget <= 0) {
                  patchTruncated = true;
                  break;
                }
              }
              const commits = commitsResponse.data.slice(0, 50).map((item) => ({
                sha: String(item.sha ?? "").slice(0, 40),
                message: bounded(item.commit?.message, 1_024)[0],
              }));
              commandContext.changedPaths = paths;
              commandContext.pullRequest = {
                baseSha: pull.base.sha,
                headSha: pull.head.sha,
                title: bounded(pull.title, 512)[0],
                body: bounded(pull.body, 12_000)[0],
                files,
                commits,
              };
              commandContext.truncated.files = hasNextPage(filesResponse) || filesResponse.data.length > files.length;
              commandContext.truncated.patches = patchTruncated;
              commandContext.truncated.commits = hasNextPage(commitsResponse);
            }

            const encoded = `${JSON.stringify(commandContext)}\n`;
            if (Buffer.byteLength(encoded) > 512_000) {
              throw new Error("Bounded command context unexpectedly exceeds 512 KiB.");
            }
            const outputDirectory = path.join(process.env.RUNNER_TEMP, "context");
            fs.mkdirSync(outputDirectory, { recursive: true });
            fs.writeFileSync(path.join(outputDirectory, "context.json"), encoded);

      - name: Upload bounded context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-command-context
          path: ${{ runner.temp }}/context/context.json
          if-no-files-found: error
          retention-days: 1

  model:
    name: Run isolated assistant
    needs: collect
    permissions: {}
    uses: ./.github/workflows/opencode-model.yml
    with:
      context-artifact: opencode-command-context
      mode: command
      model: ${{ vars.OPENCODE_ASSISTANT_MODEL || 'opencode-go/kimi-k3' }}
      result-artifact: opencode-command-result
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

  publish:
    name: Publish validated answer
    needs: [collect, model]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Download bounded context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opencode-command-context
          path: ${{ runner.temp }}/context

      - name: Download validated result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opencode-command-result
          path: ${{ runner.temp }}/result

      - name: Revalidate authorization and publish answer
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_KIND: ${{ github.event_name }}
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("node:fs");
            const path = require("node:path");

            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            const target = Number(process.env.TARGET_NUMBER);
            const commentId = Number(process.env.COMMENT_ID);
            const kind = process.env.COMMENT_KIND;
            const temp = process.env.RUNNER_TEMP;
            const commandContext = JSON.parse(fs.readFileSync(path.join(temp, "context/context.json"), "utf8"));
            const result = JSON.parse(fs.readFileSync(path.join(temp, "result/result.json"), "utf8"));

            function isObject(value) {
              return value !== null && typeof value === "object" && !Array.isArray(value);
            }

            function hasExactKeys(value, expected) {
              return isObject(value) && Object.keys(value).sort().join("\0") === [...expected].sort().join("\0");
            }

            async function getSource() {
              if (kind === "issue_comment") {
                return (await github.rest.issues.getComment({ owner, repo, comment_id: commentId })).data;
              }
              if (kind === "pull_request_review_comment") {
                return (await github.rest.pulls.getReviewComment({ owner, repo, comment_id: commentId })).data;
              }
              throw new Error("Unsupported comment event.");
            }

            if (commandContext.repository !== repository || commandContext.number !== target) {
              throw new Error("Context target does not match the triggering event.");
            }
            if (commandContext.sourceCommentId !== commentId || commandContext.sourceCommentKind !== kind) {
              throw new Error("Context comment does not match the triggering event.");
            }
            if (commandContext.pullRequest) {
              const pull = (await github.rest.pulls.get({ owner, repo, pull_number: target })).data;
              if (
                pull.head.sha !== commandContext.pullRequest.headSha ||
                pull.base.sha !== commandContext.pullRequest.baseSha
              ) {
                console.log("Skipping stale answer because the PR base or head changed.");
                return;
              }
            }

            const source = await getSource();
            if (source.user?.id !== 68006090) {
              throw new Error("Command author is no longer authorized.");
            }
            const currentCommand = source.body ?? "";
            if (currentCommand !== commandContext.command) {
              throw new Error("Command changed while the answer was generated.");
            }
            if (!/^\/(?:oc|opencode)(?:\s|$)/u.test(currentCommand)) {
              throw new Error("Command no longer has authorized syntax.");
            }

            if (
              !hasExactKeys(result, ["schemaVersion", "answer"]) ||
              !Number.isInteger(result.schemaVersion) ||
              result.schemaVersion !== 1
            ) {
              throw new Error("Invalid command result contract.");
            }
            const answer = result.answer;
            if (typeof answer !== "string" || answer.length < 1 || answer.length > 12_000) {
              throw new Error("Invalid command answer.");
            }
            function hasUnpairedSurrogate(value) {
              for (let index = 0; index < value.length; index += 1) {
                const code = value.charCodeAt(index);
                if (code >= 0xd800 && code <= 0xdbff) {
                  const next = value.charCodeAt(index + 1);
                  if (!(next >= 0xdc00 && next <= 0xdfff)) return true;
                  index += 1;
                } else if (code >= 0xdc00 && code <= 0xdfff) {
                  return true;
                }
              }
              return false;
            }
            if (/[\x00-\x08\x0b\x0c\x0e-\x1f]/u.test(answer) || hasUnpairedSurrogate(answer)) {
              throw new Error("Command answer contains control characters or malformed Unicode.");
            }
            const lowered = answer.toLowerCase();
            if (
              answer.includes("<!--") ||
              answer.includes("![") ||
              ["<img", "<script", "<style", "<iframe"].some((tag) => lowered.includes(tag))
            ) {
              throw new Error("Command answer contains unsafe Markdown or HTML.");
            }

            const marker = `<!-- opencode-command:${commentId} -->`;
            const comments = [];
            let complete = false;
            for (let page = 1; page <= 20; page += 1) {
              const batch = (await github.rest.issues.listComments({ owner, repo, issue_number: target, per_page: 100, page })).data;
              comments.push(...batch);
              if (batch.length < 100) {
                complete = true;
                break;
              }
            }
            if (!complete) {
              throw new Error("Too many existing comments to prove idempotence safely.");
            }
            if (comments.some((comment) => comment.user?.id === 41898282 && (comment.body ?? "").includes(marker))) {
              console.log("An answer for this command already exists.");
              return;
            }

            const body = `${marker}\n${answer.replaceAll("@", "@\u200b")}`;
            const latestSource = await getSource();
            if (latestSource.body !== commandContext.command || latestSource.user?.id !== 68006090) {
              console.log("Skipping answer because the command changed before publication.");
              return;
            }
            if (commandContext.pullRequest) {
              const latestPull = (await github.rest.pulls.get({ owner, repo, pull_number: target })).data;
              if (
                latestPull.head.sha !== commandContext.pullRequest.headSha ||
                latestPull.base.sha !== commandContext.pullRequest.baseSha
              ) {
                console.log("Skipping stale answer because the PR changed before publication.");
                return;
              }
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: target, body });
