    '@heroui/styles': '^3.2.4'
    '@react-spectrum/provider': '^3.11.1'
    tailwind-variants: '^3.3.1'
    '@internationalized/date': '^3.12.3'

  tanstack:
    '@tanstack/react-query': '^5.102.8'
    '@tanstack/react-query-devtools': '^5.101.4'
    '@tanstack/react-query-persist-client': '^5.101.4'

  lingui:
    '@lingui/core': '^6.6.0'
